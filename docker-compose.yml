version: '3.8'

services:
  mlflow-server:
    image: python:3.12-slim
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      # Mount thư mục tmp hiện tại trên máy host vào container để đồng bộ DB & artifacts
      - ./tmp:/app/tmp
    working_dir: /app
    command: >
      sh -c "pip install mlflow && 
             mkdir -p tmp && 
             mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts '*' --backend-store-uri sqlite:///tmp/mlflow.db --default-artifact-root /app/tmp/mlflow_artifact"
