stages:
  ingest:
    cmd: python -m src.data.ingest
    params:
      - ingest
    deps:
      - src/data/ingest.py
    outs:
      - data/raw

  split:
    cmd: python -m src.data.split
    deps:
      - data/raw
      - src/data/split.py
    outs:
      - data/split/train_raw.parquet
      - data/split/val_raw.parquet
      - data/split/test_raw.parquet

  train:
    cmd: python -m src.training.train
    params:
      - train
    deps:
      - data/split
      - data/raw/nyc_taxi_lookup_with_coords.csv
      - src/config
      - src/data/preparation.py
      - src/features
      - src/training
    outs:
      - reports/mlflow_run.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false

  register_model:
    cmd: python -m src.training.register_model
    deps:
      - reports/mlflow_run.json
      - src/config
      - src/training/register_model.py
    outs:
      - reports/registry.json:
          cache: false
