stages:
  ingest:
    cmd: python -m src.data.ingest
    params:
      - ingest
    deps:
      - src/data/ingest.py
    outs:
      - data/raw

  split:
    cmd: python -m src.data.split
    deps:
      - data/raw
      - src/data/split.py
    outs:
      - data/split/train_raw.parquet
      - data/split/val_raw.parquet
      - data/split/test_raw.parquet

  train:
    cmd: python -m src.training.train
    params:
      - train
    deps:
      - data/split
      - data/raw/nyc_taxi_lookup_with_coords.csv
      - src/config/paths.py
      - src/config/settings.py
      - src/data/preparation.py
      - src/features/engineering.py
      - src/features/transformer.py
      - src/monitoring/lineage.py
      - src/training/pipeline.py
      - src/training/tracker.py
      - src/training/train.py
      - src/utils/geo.py
      - src/utils/io.py
    outs:
      - reports/mlflow_run.json:
          cache: false
      - reports/feature_importance.png:
          cache: false
      - reports/error_analysis.png:
          cache: false
      - reports/segment_metrics.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false

  register_model:
    cmd: python -m src.training.register_model
    deps:
      - reports/mlflow_run.json
      - src/config/paths.py
      - src/config/settings.py
      - src/training/register_model.py
      - src/utils/io.py
    outs:
      - reports/registry.json:
          cache: false
