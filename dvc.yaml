stages:
  ingest:
    cmd: python -m src.data.ingest
    params:
      - ingest
    deps:
      - src/data/ingest.py
    outs:
      - data/raw

  split:
    cmd: python -m src.data.split
    deps:
      - data/raw
      - src/data/split.py
    outs:
      - data/split/train_raw.parquet
      - data/split/val_raw.parquet
      - data/split/test_raw.parquet

  fit_preprocessor:
    cmd: python -m src.data.fit_preprocessor
    deps:
      - data/split/train_raw.parquet
      - src/data/fit_preprocessor.py
      - src/config
      - src/features
    outs:
      - artifacts/preprocessor.pkl

  transform:
    cmd: python -m src.data.transform
    deps:
      - data/split
      - artifacts/preprocessor.pkl
      - src/data/transform.py
      - src/config
      - src/features
    outs:
      - data/processed

  train:
    cmd: python -m src.training.train
    params:
      - train
    deps:
      - data/processed
      - artifacts/preprocessor.pkl
      - src/config
      - src/features
      - src/training/train.py
    outs:
      - models/model.pkl:
          cache: false
      - reports/mlflow_run.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false

