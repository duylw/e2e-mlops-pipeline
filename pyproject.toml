[project]
name = "nyc-green-taxi-duration-mlops"
version = "0.1.0"
description = "MLOps portfolio project for NYC green taxi trip duration prediction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle>=3.0.0",
    "mlflow>=2.15.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0,<3",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.9.0",
    "xgboost>=3.4.0",
]

[dependency-groups]
serving = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
]
training = [
    "dvc>=3.67.1",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "optuna>=4.9.0",
    "pyarrow>=15.0.0,<20",
    "requests>=2.32.0",
]
monitoring = [
    "evidently>=0.7.21,<0.8",
    "pyarrow>=15.0.0,<20",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.uv]
default-groups = "all"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest_temp"




